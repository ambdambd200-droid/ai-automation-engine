name: Daily Self-Healing Check

"on":
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to heal (mostaql|nafezly|n8n|all)'
        type: choice
        choices: ['all', 'mostaql', 'nafezly', 'n8n']
        default: 'all'

jobs:
  healing-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGINE_URL: http://localhost:5000
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      MOSTAQL_EMAIL: ${{ secrets.MOSTAQL_EMAIL }}
      MOSTAQL_PASSWORD: ${{ secrets.MOSTAQL_PASSWORD }}
      NAFEZLY_EMAIL: ${{ secrets.NAFEZLY_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (with retry)
        run: |
          set -e
          for i in {1..3}; do
            echo "Attempt $i: Updating package list..."
            sudo apt-get update && break || { echo "Attempt $i failed, retrying..."; sleep 10; }
          done
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libxshmfence1 libxcb1 libxext6 libxrender1 \
            libxi6 libxtst6 libxshmfence1 libxcb1 libxext6 libxrender1 \
            libxi6 libxtst6 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 libxshmfence1 libxcb1 \
            libxext6 libxrender1 libxi6 libxtst6 || true

      - name: Install Python dependencies (root)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps || true
          python -m playwright install-deps chromium || true

      - name: Install Python dependencies (engine)
        run: |
          cd ai-automation-engine
          pip install -r requirements.txt

      - name: Create sessions directory
        run: mkdir -p sessions

      - name: Restore sessions from cache
        uses: actions/cache@v4
        with:
          path: sessions/
          key: freelance-sessions-${{ runner.os }}-${{ hashFiles('sessions/*.json') }}
          restore-keys: |
            freelance-sessions-${{ runner.os }}-

      - name: Start AI engine locally
        run: |
          cd ai-automation-engine
          python app.py &
          ENGINE_PID=$!
          echo "ENGINE_PID=$ENGINE_PID" >> $GITHUB_ENV
          sleep 10
          for i in {1..5}; do
            curl -sf http://localhost:5000/health && break || { echo "Waiting for engine... ($i/5)"; sleep 3; }
          done

      - name: Run self-healing check
        run: python scripts/notify_healing.py
        env:
          HEAL_PLATFORM: ${{ github.event.inputs.platform || 'all' }}

      - name: Stop engine
        if: always()
        run: |
          if [ -n "$ENGINE_PID" ]; then
            kill $ENGINE_PID 2>/dev/null || true
          fi
        env:
          ENGINE_PID: ${{ env.ENGINE_PID }}

      - name: Save sessions to cache
        uses: actions/cache@v4
        with:
          path: sessions/
          key: freelance-sessions-${{ runner.os }}-${{ hashFiles('sessions/*.json') }}