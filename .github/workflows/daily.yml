name: Daily Freelance Run with Self-Healing

"on":
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC = 7 AM Gaza (winter)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual posts)'
        type: boolean
        default: false
      platform:
        description: 'Platform to run (both|mostaql|nafezly|n8n)'
        type: choice
        choices: ['both', 'mostaql', 'nafezly', 'n8n']
        default: 'both'
  # Backup trigger to bypass GitHub UI bug with /actions/manual
  repository_dispatch:
    types: [daily-run]

jobs:
  daily-freelance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      MOSTAQL_EMAIL: ${{ secrets.MOSTAQL_EMAIL }}
      MOSTAQL_PASSWORD: ${{ secrets.MOSTAQL_PASSWORD }}
      NAFEZLY_EMAIL: ${{ secrets.NAFEZLY_EMAIL }}
      NAFEZLY_PASSWORD: ${{ secrets.NAFEZLY_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ENGINE_URL: http://localhost:5000
      ENGINE_FROM_EMAIL: ${{ secrets.ENGINE_FROM_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (with retry)
        run: |
          set -e
          echo "=== Installing system dependencies ==="
          for i in {1..3}; do
            echo "Attempt $i: Updating package list..."
            sudo apt-get update && break || { echo "Attempt $i failed, retrying in 10s..."; sleep 10; }
          done
          echo "Installing system dependencies for Playwright..."
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libxshmfence1 libxcb1 libxext6 libxrender1 \
            libxi6 libxtst6 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 libxshmfence1 libxcb1 \
            libxext6 libxrender1 libxi6 libxtst6 || { echo "ERROR: Failed to install system dependencies"; exit 1; } libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 libxshmfence1 libxcb1 \
            libxext6 libxrender1 libxi6 libxtst6 libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2 libxshmfence1 libxcb1 libxext6 libxrender1 libxi6 \
            libxtst6

      - name: Install Python dependencies (root)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "Installing Playwright Chromium..."
          python -m playwright install chromium --with-deps || { echo "ERROR: Playwright install failed"; exit 1; }
          python -m playwright install-deps chromium || { echo "ERROR: Playwright deps install failed"; exit 1; }

      - name: Install Python dependencies (engine)
        run: |
          cd ai-automation-engine
          pip install -r requirements.txt

      - name: Create sessions directory
        run: mkdir -p sessions

      - name: Restore sessions from cache
        uses: actions/cache@v4
        with:
          path: sessions/
          key: freelance-sessions-${{ runner.os }}-${{ hashFiles('sessions/*.json') }}
          restore-keys: |
            freelance-sessions-${{ runner.os }}-

      - name: Start AI engine locally
        run: |
          cd ai-automation-engine
          python app.py &
          ENGINE_PID=$!
          echo "ENGINE_PID=$ENGINE_PID" >> $GITHUB_ENV
          sleep 5
          echo "Waiting for engine to be healthy..."
          for i in {1..10}; do
            if curl -sf http://localhost:5000/health; then
              echo "Engine is healthy!"
              break
            fi
            echo "Waiting for engine... ($i/10)"
            sleep 3
          done
          # Final health check - fail if engine not ready
          curl -sf http://localhost:5000/health || { echo "ERROR: Engine failed to start"; exit 1; }

      - name: Verify Playwright installation
        run: |
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); browser.close(); p.stop(); print('Playwright OK')" || { echo "ERROR: Playwright not working"; exit 1; }

- name: Verify Playwright installation
        run: |
          echo "Verifying Playwright installation..."
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); browser.close(); p.stop(); print('Playwright OK')" || { echo "ERROR: Playwright not working"; exit 1; }

- name: Test engine API
        run: |
          echo "Testing engine API..."
          curl -sf http://localhost:5000/health || { echo "ERROR: Engine health check failed"; exit 1; }
          curl -sf -X POST http://localhost:5000/api/bid/generate -H "Content-Type: application/json" -d '{"platform":"mostaql","project_title":"test","project_description":"test","budget":"100"}' || { echo "ERROR: Engine API test failed"; exit 1; }

- name: Run daily freelance routine
        run: |
          set -e
          if [ "${{ github.event.inputs.platform }}" = "both" ]; then
            python run_daily_freelance.py
          else
            python run_daily_freelance.py --only ${{ github.event.inputs.platform || 'both' }}
          fi
        env:
          GITHUB_ACTIONS: 'true'

      - name: Stop engine
        if: always()
        run: |
          if [ -n "$ENGINE_PID" ]; then
            kill $ENGINE_PID 2>/dev/null || true
          fi
        env:
          ENGINE_PID: ${{ env.ENGINE_PID }}

      - name: Save sessions to cache
        uses: actions/cache@v4
        with:
          path: sessions/
          key: freelance-sessions-${{ runner.os }}-${{ hashFiles('sessions/*.json') }}

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-logs
          path: |
            out/
            screenshots/
            daily_freelance_state.json
            telegram_controller.log
          retention-days: 7

      - name: Send completion notification
        if: always()
        run: python scripts/notify_daily.py
        env:
          RUN_STATUS: ${{ job.status }}