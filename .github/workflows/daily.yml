name: Daily Freelance Run with Self-Healing

on:
  schedule:
    - cron: '0 4 * * *'  # 4 AM UTC = 7 AM Gaza (winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual posts)'
        type: boolean
        default: false
      platform:
        description: 'Platform to run (both|mostaql|nafezly|n8n)'
        type: choice
        choices: ['both', 'mostaql', 'nafezly', 'n8n']
        default: 'both'

jobs:
  daily-freelance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      MOSTAQL_EMAIL: ${{ secrets.MOSTAQL_EMAIL }}
      MOSTAQL_PASSWORD: ${{ secrets.MOSTAQL_PASSWORD }}
      NAFEZLY_EMAIL: ${{ secrets.NAFEZLY_EMAIL }}
      NAFEZLY_PASSWORD: ${{ secrets.NAFEZLY_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ENGINE_URL: http://localhost:5000
      ENGINE_FROM_EMAIL: ${{ secrets.ENGINE_FROM_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install Python dependencies (root)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Install Python dependencies (engine)
        run: |
          cd ai-automation-engine
          pip install -r requirements.txt

      - name: Create sessions directory
        run: mkdir -p sessions

      - name: Restore sessions from cache
        uses: actions/cache@v4
        with:
          path: sessions/
          key: freelance-sessions-${{ runner.os }}-${{ hashFiles('sessions/*.json') }}
          restore-keys: |
            freelance-sessions-${{ runner.os }}-

      - name: Start AI engine locally
        run: |
          cd ai-automation-engine
          python app.py &
          ENGINE_PID=$!
          echo "ENGINE_PID=$ENGINE_PID" >> $GITHUB_ENV
          sleep 8
          curl -sS http://localhost:5000/health || echo "engine not ready"

      - name: Run daily freelance routine
        run: |
          if [ "${{ github.event.inputs.platform }}" = "both" ]; then
            python run_daily_freelance.py
          else
            python run_daily_freelance.py --only ${{ github.event.inputs.platform || 'both' }}
          fi
        env:
          GITHUB_ACTIONS: 'true'

      - name: Stop engine
        if: always()
        run: |
          if [ -n "$ENGINE_PID" ]; then
            kill $ENGINE_PID 2>/dev/null || true
          fi
        env:
          ENGINE_PID: ${{ env.ENGINE_PID }}

      - name: Save sessions to cache
        uses: actions/cache@v4
        with:
          path: sessions/
          key: freelance-sessions-${{ runner.os }}-${{ hashFiles('sessions/*.json') }}

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-logs
          path: |
            out/
            screenshots/
            daily_freelance_state.json
            telegram_controller.log
          retention-days: 7

      - name: Send completion notification
        if: always()
        run: |
          python -c "
import os, sys, json
sys.path.insert(0, '.')
from telegram_notifier import notify
status = '✅ SUCCESS' if os.environ.get('RUN_STATUS') == '0' else '❌ FAILED'
notify(f'{status} Daily Freelance Run\nGitHub Actions: {os.environ.get(\"GITHUB_RUN_NUMBER\")}\nCommit: {os.environ.get(\"GITHUB_SHA\", \"\")[:8]}')
          "
        env:
          RUN_STATUS: ${{ job.status }}