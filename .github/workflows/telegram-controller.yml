name: Telegram Controller 24/7

"on":
  schedule:
    # Run every 5 hours (GitHub Actions max is 6 hours for scheduled jobs)
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  telegram-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max (GitHub Actions limit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (with retry)
        run: |
          set -e
          for i in {1..3}; do
            echo "Attempt $i: Updating package list..."
            sudo apt-get update && break || { echo "Attempt $i failed, retrying..."; sleep 10; }
          done
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libxshmfence1 libxcb1 libxext6 libxrender1 \
            libxi6 libxtst6 libxshmfence1 libxcb1 libxext6 libxrender1 \
            libxi6 libxtst6 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 libxshmfence1 libxcb1 \
            libxext6 libxrender1 libxi6 libxtst6 libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2 libxshmfence1 libxcb1 libxext6 libxrender1 libxi6 \
            libxtst6 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 || true

      - name: Install Python dependencies (root)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps || true
          python -m playwright install-deps chromium || true

      - name: Install Python dependencies (engine)
        run: |
          cd ai-automation-engine
          pip install -r requirements.txt

      - name: Start AI engine locally
        run: |
          cd ai-automation-engine
          python app.py &
          ENGINE_PID=$!
          echo "ENGINE_PID=$ENGINE_PID" >> $GITHUB_ENV
          sleep 10
          for i in {1..5}; do
            curl -sf http://localhost:5000/health && break || { echo "Waiting for engine... ($i/5)"; sleep 3; }
          done

      - name: Run Telegram controller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ENGINE_URL: http://localhost:5000
          MOSTAQL_EMAIL: ${{ secrets.MOSTAQL_EMAIL }}
          MOSTAQL_PASSWORD: ${{ secrets.MOSTAQL_PASSWORD }}
          NAFEZLY_EMAIL: ${{ secrets.NAFEZLY_EMAIL }}
        run: |
          echo "Starting Telegram Controller at $(date -u)"
          python scripts/notify_telegram_start.py
          python telegram_controller.py 2>&1 | tee telegram_controller_run.log
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Stop engine
        if: always()
        run: |
          if [ -n "$ENGINE_PID" ]; then
            kill $ENGINE_PID 2>/dev/null || true
          fi
        env:
          ENGINE_PID: ${{ env.ENGINE_PID }}

      - name: Send completion notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram_end.py
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-controller-logs-${{ github.run_id }}
          path: |
            telegram_controller.log
            telegram_controller_run.log
            telegram_log.md
          retention-days: 7