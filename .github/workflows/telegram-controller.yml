name: Telegram Controller 24/7

"on":
  schedule:
    # Run every 5 hours (GitHub Actions max is 6 hours for scheduled jobs)
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  telegram-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max (GitHub Actions limit)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -r ai-automation-engine/requirements.txt || true

      - name: Start AI engine locally
        run: |
          cd ai-automation-engine
          python app.py &
          ENGINE_PID=$!
          echo "ENGINE_PID=$ENGINE_PID" >> $GITHUB_ENV
          sleep 8
          curl -sS http://localhost:5000/health || echo "engine not ready"

      - name: Run Telegram controller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ENGINE_URL: http://localhost:5000
          MOSTAQL_EMAIL: ${{ secrets.MOSTAQL_EMAIL }}
          MOSTAQL_PASSWORD: ${{ secrets.MOSTAQL_PASSWORD }}
          NAFEZLY_EMAIL: ${{ secrets.NAFEZLY_EMAIL }}
        run: |
          echo "Starting Telegram Controller at $(date -u)"
          # Send startup notification
          python -c "
            import os, sys
            sys.path.insert(0, '.')
            from telegram_notifier import notify
            notify('🤖 Telegram Controller started on GitHub Actions\nRun ID: ${{ github.run_id }}')
          "
          # Run the controller in foreground (will run until timeout)
          python telegram_controller.py 2>&1 | tee telegram_controller_run.log
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Stop engine
        if: always()
        run: |
          if [ -n "$ENGINE_PID" ]; then
            kill $ENGINE_PID 2>/dev/null || true
          fi
        env:
          ENGINE_PID: ${{ env.ENGINE_PID }}

      - name: Send completion notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
            import os, sys
            sys.path.insert(0, '.')
            from telegram_notifier import notify
            status = '✅ Completed' if os.environ.get('JOB_STATUS') == 'success' else '⚠️ Timed out (restarting)'
            notify(f'🤖 Telegram Controller: {status}\nRun: ${{ github.run_id }}\nNext run in ~5 hours')
          "
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-controller-logs-${{ github.run_id }}
          path: |
            telegram_controller.log
            telegram_controller_run.log
            telegram_log.md
          retention-days: 7