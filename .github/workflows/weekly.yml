name: Weekly Portfolio Review

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 4 AM UTC
  workflow_dispatch:

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENGINE_URL: https://ai-automation-engine.onrender.com
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly portfolio creation (placeholder)
        run: |
          python -c "
from datetime import datetime
from telegram_notifier import notify
notify(f'📅 Weekly Review - {datetime.now().strftime(\"%Y-%m-%d\")}\n\nReminder: Create portfolio pieces manually:\n- Nafezly portfolio\n- Mostaql portfolio  \n- Nafezly service page\n\nSee create_portfolio.py for workflow.')
          "